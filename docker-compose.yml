services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: swarm, POSTGRES_PASSWORD: swarm, POSTGRES_DB: swarmdial }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U swarm"], interval: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://swarm:swarm@postgres:5432/swarmdial
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]
  frontend:
    build: { context: ./frontend, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  pgdata:
